config-version = 2
key-mapping.preset = 'qwerty'

start-at-login = true
auto-reload-config = true

# https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'accordion'
default-root-container-orientation = 'horizontal'

persistent-workspaces = [
	"Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P",
	"A", "S", "D", "F", "G", "H", "J", "K", "L", ";",
	"Z", "X", "C", "V", "B", "N", "M"
]

accordion-padding     = 0
gaps.inner.horizontal = 0
gaps.inner.vertical   = 0
gaps.outer.left       = 0
gaps.outer.bottom     = 0
gaps.outer.top        = 0
gaps.outer.right      = 0

on-window-detected = [
	{ if = 'test %{app-bundle-id} = com.anthropic.claudefordesktop', run = ['move-node-to-workspace --focus-follows-window C'] },
	{ if = 'test %{app-bundle-id} = com.microsoft.VSCode',           run = ['move-node-to-workspace --focus-follows-window V'] },
	{ if = 'test %{app-bundle-id} = net.imput.helium',               run = ['move-node-to-workspace --focus-follows-window S'] },
	{ if = 'test %{app-bundle-id} = com.mitchellh.ghostty',          run = ["move-node-to-workspace --focus-follows-window ';'"] },
	{ if = 'test %{app-bundle-id} = com.apple.mail',                 run = ['move-node-to-workspace --focus-follows-window M'] },
	{ if = 'test %{app-bundle-id} = com.apple.Notes',                run = ['move-node-to-workspace --focus-follows-window N'] },
	# { if = 'true',                                                   run = ['move-node-to-workspace --focus-follows-window Q'] },
]
